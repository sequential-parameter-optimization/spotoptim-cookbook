[project]
name = "spotoptim-cookbook"
version = "0.1.0"
description = "Tutorials and worked examples for the spotoptim sequential parameter optimization toolbox."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.10.7",
    "pandas>=2.3.3",
    "spotoptim[all]>=2.1.0",
    "spotdesirability>=0.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
